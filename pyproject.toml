[project]
name = "jabra-speak510-mute"
version = "0.1.0"
description = "Track the Jabra Speak 510 hardware mute button and optionally drive Home Assistant lights."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
jabra-speak510-mute = "jabra_speak510_mute.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jabra_speak510_mute"]
